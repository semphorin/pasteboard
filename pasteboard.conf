# Pasteboard configuration (key = value). Lines starting with # are comments.
# Precedence: CLI flags > PASTEBOARD_* env vars > this file > built-in defaults.

bind = 0.0.0.0
port = 9911
data_dir = ./data

# Limits
max_entries = 200
max_text_kb = 256
max_text_total_mb = 8
max_file_mb = 10
max_blob_total_mb = 200
max_sse_clients = 32
