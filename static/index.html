<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>pasteboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='4' width='22' height='26' rx='6' fill='%23111'/%3E%3Crect x='11' y='2' width='10' height='6' rx='3' fill='%23999'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Roboto Mono";src:url(/font.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{
  --bg:#f3f3f2;--surface:#fff;--sunken:#f7f7f6;--line:#e3e3e1;--line-strong:#cfcfcc;
  --text:#121212;--muted:#6e6e6c;--faint:#a3a3a0;--ink:#121212;--on-ink:#fafafa;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --r:14px;--r-sm:10px;
  --mono:"Roboto Mono",ui-monospace,"Cascadia Code",Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0d0e;--surface:#161618;--sunken:#111113;--line:#26262a;--line-strong:#36363b;
  --text:#ececec;--muted:#8d8d92;--faint:#5c5c61;--ink:#ececec;--on-ink:#111;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--mono);-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{font-weight:700;font-size:18px;letter-spacing:-.02em}
.logo span{color:var(--faint)}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted)}
.live .dot{background:var(--ink);border-color:var(--ink)}
.usage{font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:10px;border-right:1px solid var(--line-strong)}
.usage.full{color:var(--text);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.composer{padding:12px;transition:border-color .15s}
.composer.drag{border-color:var(--ink);border-style:dashed}
textarea{display:block;width:100%;min-height:120px;max-height:50vh;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:6px}
textarea::placeholder{color:var(--faint)}
.bar{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.hint{color:var(--faint);font-size:12px;flex:1;min-width:0}
kbd{font:inherit;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:6px;padding:0 5px;font-size:11px}
button,.btn{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:500;transition:transform .12s,opacity .12s,background .12s}
.pill:active{transform:scale(.97)}
.pill.primary{background:var(--ink);color:var(--on-ink)}
.pill.primary:disabled{opacity:.35;cursor:default;transform:none}
.pill.ghost{border:1px solid var(--line-strong)}
.pill.ghost:hover{background:var(--sunken)}
.pill svg{width:15px;height:15px}
.list-head{display:flex;align-items:baseline;justify-content:space-between;margin:30px 4px 10px;color:var(--muted);font-size:12px;text-transform:lowercase}
#list{display:flex;flex-direction:column;gap:10px}
.entry{padding:12px 12px 10px 14px;animation:in .14s ease-out}
.entry.pinned{border-color:var(--line-strong);box-shadow:inset 3px 0 0 var(--ink),var(--shadow)}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.meta{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12px;margin-bottom:6px}
.meta .tag{color:var(--muted)}
.acts{margin-left:auto;display:flex;gap:2px}
.icon{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:9px;color:var(--muted);transition:background .12s,color .12s}
.icon:hover{background:var(--sunken);color:var(--text)}
.icon.on{color:var(--text)}
.icon.warn{background:var(--ink);color:var(--on-ink)}
.icon svg{width:16px;height:16px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font:inherit;max-height:260px;overflow:hidden;position:relative}
pre.open{max-height:none}
.more{margin-top:6px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.thumb{display:block;max-width:100%;max-height:300px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--sunken)}
.file{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--sunken);color:inherit;text-decoration:none;min-width:0}
.file:hover{background:var(--line)}
.file b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.file small{color:var(--muted);flex-shrink:0}
.file svg{width:18px;height:18px;flex-shrink:0;color:var(--muted)}
.me{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line-strong);border-radius:999px;font-size:12px;color:var(--muted);max-width:min(240px,46vw)}
.me:hover{color:var(--text);background:var(--surface)}
.me svg{width:13px;height:13px;flex-shrink:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me input{font:inherit;color:var(--text);background:transparent;border:0;outline:0;width:150px;padding:0}
.toolbar{display:flex;align-items:center;gap:8px;margin:30px 4px 10px;color:var(--muted);font-size:12px}
.toolbar .grow{flex:1}
select{font:inherit;font-size:12px;color:var(--text);background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;height:28px;padding:0 10px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;white-space:nowrap;transition:background .12s,color .12s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.chip b{font-weight:500;opacity:.6;margin-left:4px}
.group{margin:10px 4px 0;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px}
.group::after{content:"";flex:1;height:1px;background:var(--line)}
.dev{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dev.mine{color:var(--text)}
.meta .ip{color:var(--faint)}
.meta .sep{color:var(--line-strong)}
.uploads{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.uploads:empty{display:none}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:6px 10px;padding:6px 4px 8px 12px;border-radius:var(--r-sm);background:var(--sunken);font-size:12px;animation:in .14s ease-out}
.up .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .stat{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.up .icon{width:26px;height:26px}
.up .track{grid-column:1/-1;height:4px;margin-right:8px;border-radius:2px;background:var(--line);overflow:hidden}
.up .fill{height:100%;width:0;background:var(--ink);transition:width .2s linear}
.up.done .fill{width:100%}
.up.err .fill{background:var(--faint)}
.up.err .stat{color:var(--text)}
.empty{padding:40px 16px;text-align:center;color:var(--faint);border:1px dashed var(--line-strong);border-radius:var(--r)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:var(--ink);color:var(--on-ink);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:480px){.wrap{padding-top:18px}.hint{display:none}textarea{min-height:96px}.meta .ip,.meta .size{display:none}.me{max-width:38vw;min-width:0;flex-shrink:1}#status-text{display:none}.usage{padding-right:8px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">paste<span>board</span></div>
    <div class="status" id="status"><span class="usage" id="usage" hidden></span><span class="dot"></span><span id="status-text">connecting</span></div>
    <button class="me" id="me" title="This device's name, shown on what you send. Click to rename."></button>
  </header>

  <section class="card composer" id="composer">
    <textarea id="input" placeholder="Paste or type something…" spellcheck="false" autofocus></textarea>
    <div class="bar">
      <label class="pill ghost btn" title="Attach files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
        attach<input type="file" id="file" class="sr" multiple>
      </label>
      <span class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to send · paste or drop files</span>
      <button class="pill primary" id="send" disabled>send</button>
    </div>
    <div class="uploads" id="uploads" aria-label="Uploads"></div>
  </section>

  <div class="toolbar">
    <span>history</span><span id="count"></span><span class="grow"></span>
    <label class="sr" for="sort">Sort</label>
    <select id="sort"><option value="newest">newest first</option><option value="device">by device</option></select>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filter by device"></div>
  <div id="list"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const input = $("input"), sendBtn = $("send"), list = $("list");
const entries = new Map(); // id -> entry
const nodes = new Map();   // id -> element

const ICONS = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="3"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg>',
  pinned: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5" fill="none"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>',
  device: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  cancel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
};

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k);
  return n;
}
function iconBtn(name, title, onclick) {
  const b = el("button", { class: "icon", title, "aria-label": title, onclick });
  b.innerHTML = ICONS[name]; // static, trusted markup
  return b;
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 45) return "just now";
  const m = s / 60; if (m < 60) return Math.round(m) + "m ago";
  const h = m / 60; if (h < 24) return Math.round(h) + "h ago";
  const d = h / 24; if (d < 7) return Math.round(d) + "d ago";
  return new Date(ts).toLocaleDateString();
}
function size(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
const INLINE = ["image/png", "image/jpeg", "image/gif", "image/webp"];

// ---- clipboard (works over plain http via execCommand fallback) ----
async function copyText(text) {
  if (window.isSecureContext && navigator.clipboard) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  }
  const ta = el("textarea", { readonly: "", style: "position:fixed;top:-1000px;opacity:0" });
  ta.value = text;
  document.body.append(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (_) {}
  ta.remove();
  return ok;
}
async function copyEntry(e) {
  if (e.kind === "text") return toast((await copyText(e.text)) ? "Copied" : "Copy failed");
  if (e.mime === "image/png" && window.isSecureContext && window.ClipboardItem) {
    try {
      const blob = await (await fetch("/blob/" + e.id)).blob();
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      return toast("Image copied");
    } catch (_) {}
  }
  const ok = await copyText(new URL("/blob/" + e.id, location.href).href);
  toast(ok ? "Link copied" : "Copy failed");
}

// ---- device identity ----
const prefs = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};
function guessDevice() {
  const ua = navigator.userAgent;
  const os = /iPhone/.test(ua) ? "iPhone"
    : /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? "iPad"
    : /Android/.test(ua) ? "Android" : /CrOS/.test(ua) ? "ChromeOS" : /Windows/.test(ua) ? "Windows"
    : /Mac OS X|Macintosh/.test(ua) ? "Mac" : /Linux/.test(ua) ? "Linux" : "Device";
  const br = /Edg\//.test(ua) ? "Edge" : /OPR\//.test(ua) ? "Opera" : /Firefox\//.test(ua) ? "Firefox"
    : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "";
  return br ? os + " · " + br : os;
}
let myDevice = (prefs.get("pb.device") || "").trim().slice(0, 40) || guessDevice();
let sortMode = prefs.get("pb.sort") === "device" ? "device" : "newest";
let filterDev = prefs.get("pb.filter") || null; // null = all devices
let loaded = false;
const devName = (e) => e.device || "unknown";
const groups = new Map(); // device -> group header element (sort by device)

function renderMe() {
  const b = $("me");
  b.innerHTML = ICONS.device; // static, trusted markup
  b.append(el("span", {}, myDevice));
}
function renameDevice() {
  const b = $("me");
  const inp = el("input", { class: "me", maxlength: "40", "aria-label": "Device name", spellcheck: "false" });
  inp.value = myDevice;
  b.hidden = true;
  b.after(inp);
  inp.focus();
  inp.select();
  let cancelled = false;
  inp.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); inp.blur(); }
    else if (ev.key === "Escape") { cancelled = true; inp.blur(); }
  });
  inp.addEventListener("blur", () => {
    const v = inp.value.trim().slice(0, 40);
    inp.remove();
    b.hidden = false;
    if (cancelled || !v || v === myDevice) return;
    myDevice = v;
    prefs.set("pb.device", v);
    renderMe();
    rerenderAll();
    toast("This device is now “" + v + "”");
  });
}

// ---- rendering ----
function render(e) {
  const mine = devName(e) === myDevice;
  const meta = el("div", { class: "meta" },
    el("span", { class: "tag" }, "#" + e.id),
    el("span", { class: "dev" + (mine ? " mine" : ""), title: "sent by " + devName(e) + (e.ip ? " from " + e.ip : "") },
      devName(e) + (mine ? " (this device)" : "")),
    ...(e.ip ? [el("span", { class: "ip" }, e.ip)] : []),
    el("span", { class: "time", "data-ts": e.ts }, ago(e.ts)),
    el("span", { class: "size" }, e.kind === "text" ? size(new Blob([e.text]).size) : size(e.size)));
  const pin = iconBtn(e.pinned ? "pinned" : "pin", e.pinned ? "Unpin" : "Pin", () => setPin(e.id, !entries.get(e.id).pinned));
  if (e.pinned) pin.classList.add("on");
  const del = iconBtn("del", "Delete", () => confirmDelete(del, e.id));
  meta.append(el("span", { class: "acts" }, iconBtn("copy", "Copy", () => copyEntry(entries.get(e.id))), pin, del));

  let body;
  if (e.kind === "text") {
    const pre = el("pre");
    pre.textContent = e.text;
    body = el("div", {}, pre);
    requestAnimationFrame(() => {
      if (pre.scrollHeight > pre.clientHeight + 4) {
        const more = el("button", { class: "more" }, "show more");
        more.onclick = () => { const o = pre.classList.toggle("open"); more.textContent = o ? "show less" : "show more"; };
        body.append(more);
      }
    });
  } else if (INLINE.includes(e.mime)) {
    body = el("a", { href: "/blob/" + e.id, target: "_blank", rel: "noopener" },
      el("img", { class: "thumb", src: "/blob/" + e.id, alt: e.name, loading: "lazy" }));
  } else {
    const a = el("a", { class: "file", href: "/blob/" + e.id, download: e.name });
    a.innerHTML = ICONS.file;
    a.append(el("b", {}, e.name), el("small", {}, size(e.size)));
    body = a;
  }
  return el("article", { class: "card entry" + (e.pinned ? " pinned" : "") }, meta, body);
}

// Newest: pinned first, then newest. By device: A-Z, then pinned, then newest.
function order() {
  const shown = [...entries.values()].filter((e) => filterDev === null || devName(e) === filterDev);
  if (sortMode === "device") {
    return shown.sort((a, b) => devName(a).localeCompare(devName(b)) || (b.pinned - a.pinned) || (b.id - a.id));
  }
  return shown.sort((a, b) => (b.pinned - a.pinned) || (b.id - a.id));
}

function renderChips() {
  const counts = new Map();
  for (const e of entries.values()) counts.set(devName(e), (counts.get(devName(e)) || 0) + 1);
  if (loaded && filterDev !== null && !counts.has(filterDev)) { filterDev = null; prefs.set("pb.filter", ""); }
  const box = $("chips");
  box.hidden = counts.size < 2 && filterDev === null; // nothing to filter with one device
  if (box.hidden) return box.replaceChildren();
  const chip = (label, value, n) => {
    const on = filterDev === value;
    const c = el("button", { class: "chip" + (on ? " on" : ""), "aria-pressed": String(on) }, label, el("b", {}, String(n)));
    c.onclick = () => { filterDev = value; prefs.set("pb.filter", value ?? ""); sync(); };
    return c;
  };
  const names = [...counts.keys()].sort((a, b) => (b === myDevice) - (a === myDevice) || a.localeCompare(b));
  box.replaceChildren(chip("all devices", null, entries.size),
    ...names.map((d) => chip(d === myDevice ? d + " (you)" : d, d, counts.get(d))));
}

function sync() {
  renderChips();
  const want = order();
  const seq = [];
  let prev = null;
  for (const e of want) {
    if (sortMode === "device" && devName(e) !== prev) {
      prev = devName(e);
      let g = groups.get(prev);
      if (!g) { g = el("div", { class: "group" }); groups.set(prev, g); }
      const n = want.filter((x) => devName(x) === prev).length;
      g.textContent = prev + (prev === myDevice ? " (this device)" : "") + " · " + n;
      seq.push(g);
    }
    let n = nodes.get(e.id);
    if (!n) { n = render(e); n.dataset.id = e.id; nodes.set(e.id, n); }
    seq.push(n);
  }
  if (!seq.length) {
    const msg = entries.size && filterDev !== null ? "Nothing from " + filterDev + "." : "Nothing here yet. Paste something above.";
    list.replaceChildren(el("div", { class: "empty" }, msg));
  } else {
    list.querySelector(".empty")?.remove();
    seq.forEach((n, i) => { if (list.children[i] !== n) list.insertBefore(n, list.children[i] || null); });
    while (list.children.length > seq.length) list.lastChild.remove(); // filtered out (still cached)
  }
  for (const [id, n] of nodes) if (!entries.has(id)) { n.remove(); nodes.delete(id); }
  renderUsage();
  const total = entries.size;
  $("count").textContent = !total ? "" : want.length === total
    ? total + (total === 1 ? " item" : " items")
    : want.length + " of " + total;
}
// Stored files vs max_blob_total (text has its own, separate limit).
function renderUsage() {
  const u = $("usage");
  if (!limits?.max_blob_total_bytes || !loaded) return;
  let used = 0;
  for (const e of entries.values()) if (e.kind === "file") used += e.size;
  const cap = limits.max_blob_total_bytes, MB = 1048576;
  const mb = (n) => n < 10 * MB && n > 0 ? (n / MB).toFixed(1) : String(Math.round(n / MB));
  const pct = Math.min(100, (used / cap) * 100);
  u.textContent = mb(used) + " / " + mb(cap) + " MB";
  u.title = "Files stored: " + size(used) + " of " + size(cap) + " (" + pct.toFixed(pct < 10 ? 1 : 0) +
    "%). The oldest unpinned files are removed when this fills up.";
  u.classList.toggle("full", pct >= 90);
  u.hidden = false;
}
function rerenderAll() {
  for (const n of nodes.values()) n.remove();
  nodes.clear();
  sync();
}
function upsert(e) {
  const old = entries.get(e.id);
  entries.set(e.id, e);
  if (old && old.pinned !== e.pinned) { nodes.get(e.id)?.remove(); nodes.delete(e.id); }
}

// ---- api ----
async function api(path, opts = {}) {
  if (opts.method && opts.method !== "GET") {
    opts.headers = { ...(opts.headers || {}), "X-Device": encodeURIComponent(myDevice) };
  }
  const r = await fetch(path, opts);
  if (!r.ok) {
    const msg = r.status === 413 ? "Too large" : r.status === 503 ? "Server busy" : (await r.text()).trim() || "Error " + r.status;
    throw new Error(msg);
  }
  return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
}
async function refresh() {
  try {
    const all = await api("/api/entries");
    const ids = new Set(all.map((e) => e.id));
    for (const id of entries.keys()) if (!ids.has(id)) entries.delete(id);
    all.forEach(upsert);
    loaded = true;
    sync();
  } catch (err) { toast(err.message); }
}
async function sendText() {
  const text = input.value;
  if (!text.trim()) return;
  sendBtn.disabled = true;
  try {
    upsert(await api("/api/text", { method: "POST", body: text, headers: { "Content-Type": "text/plain; charset=utf-8" } }));
    sync();
    input.value = "";
    toast("Sent");
  } catch (err) { toast(err.message); }
  updateSend();
  input.focus();
}
// ---- uploads: XHR for progress + cancel, one at a time ----
let limits = null; // from /api/limits; null = unknown (skip the pre-check)
const queue = [];  // pending upload jobs
let activeJob = null;

function uploadRow(name) {
  const stat = el("span", { class: "stat" }, "waiting");
  const fill = el("div", { class: "fill" });
  const track = el("div", { class: "track", role: "progressbar", "aria-label": "Uploading " + name, "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": "0" }, fill);
  const row = el("div", { class: "up" }, el("span", { class: "name", title: name }, name), stat);
  const cancel = iconBtn("cancel", "Cancel upload", () => row.onCancel?.());
  row.append(cancel, track);
  row.set = (pct, text, title) => {
    fill.style.width = pct + "%";
    track.setAttribute("aria-valuenow", String(Math.round(pct)));
    stat.textContent = text;
    stat.title = title || "";
  };
  row.finish = (cls, text) => {
    row.classList.add(cls);
    stat.textContent = text;
    cancel.remove();
    setTimeout(() => row.remove(), cls === "err" ? 4000 : 900);
  };
  $("uploads").append(row);
  return row;
}

function uploadFiles(files) {
  for (const f of files) {
    const name = f.name || "pasted";
    if (limits && f.size > limits.max_file_bytes) {
      toast(name + ": too large (max " + size(limits.max_file_bytes) + ")");
      continue;
    }
    if (!f.size) { toast(name + ": empty file"); continue; }
    const job = { f, name, row: uploadRow(name), xhr: null };
    job.row.onCancel = () => {
      if (job.xhr) return job.xhr.abort(); // active: onabort finishes the row
      queue.splice(queue.indexOf(job), 1);
      job.row.finish("err", "cancelled");
    };
    queue.push(job);
  }
  pump();
}

function pump() {
  if (activeJob || !queue.length) return;
  const job = activeJob = queue.shift();
  const { f, name, row } = job;
  const xhr = job.xhr = new XMLHttpRequest();
  let lastT = performance.now(), lastLoaded = 0, rate = 0;
  xhr.open("POST", "/api/file");
  xhr.setRequestHeader("X-Device", encodeURIComponent(myDevice));
  xhr.setRequestHeader("X-Filename", encodeURIComponent(name));
  xhr.setRequestHeader("Content-Type", f.type || "application/octet-stream");
  row.set(0, "0%");
  xhr.upload.onprogress = (ev) => {
    const total = ev.lengthComputable ? ev.total : f.size;
    const now = performance.now(), dt = (now - lastT) / 1000;
    if (dt >= 0.25) { // smoothed bytes/s
      const r = (ev.loaded - lastLoaded) / dt;
      rate = rate ? rate * 0.7 + r * 0.3 : r;
      lastT = now; lastLoaded = ev.loaded;
    }
    const pct = total ? (ev.loaded / total) * 100 : 0;
    row.set(pct, Math.floor(pct) + "%" + (rate ? " · " + size(rate) + "/s" : ""), size(ev.loaded) + " of " + size(total));
  };
  const done = () => { activeJob = null; pump(); };
  xhr.onload = () => {
    if (xhr.status >= 200 && xhr.status < 300) {
      try { upsert(JSON.parse(xhr.responseText)); sync(); } catch (_) {}
      row.finish("done", "done");
      toast("Uploaded " + name);
    } else {
      const msg = xhr.status === 413 ? "too large" : xhr.status === 503 ? "server busy" : xhr.responseText.trim() || "error " + xhr.status;
      row.finish("err", msg);
      toast(name + ": " + msg);
    }
    done();
  };
  xhr.onerror = () => { row.finish("err", "network error"); toast(name + ": network error"); done(); };
  xhr.onabort = () => { row.finish("err", "cancelled"); done(); };
  xhr.send(f);
}

window.addEventListener("beforeunload", (ev) => {
  if (activeJob || queue.length) { ev.preventDefault(); ev.returnValue = ""; }
});
async function setPin(id, v) {
  try { upsert(await api("/api/entries/" + id + "/pin", { method: "POST", body: String(v) })); sync(); }
  catch (err) { toast(err.message); }
}
function confirmDelete(btn, id) {
  if (!btn.classList.contains("warn")) {
    btn.classList.add("warn");
    btn.title = "Click again to delete";
    setTimeout(() => { btn.classList.remove("warn"); btn.title = "Delete"; }, 2200);
    return;
  }
  api("/api/entries/" + id, { method: "DELETE" })
    .then(() => { entries.delete(id); sync(); })
    .catch((err) => toast(err.message));
}

// ---- composer ----
function updateSend() { sendBtn.disabled = !input.value.trim(); }
input.addEventListener("input", updateSend);
input.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); sendText(); }
});
sendBtn.addEventListener("click", sendText);
$("file").addEventListener("change", (ev) => { uploadFiles([...ev.target.files]); ev.target.value = ""; });

document.addEventListener("paste", (ev) => {
  const files = [...(ev.clipboardData?.files || [])];
  if (files.length) { ev.preventDefault(); uploadFiles(files); return; }
  if (ev.target !== input) {
    const t = ev.clipboardData?.getData("text");
    if (t) { ev.preventDefault(); input.value = t; updateSend(); input.focus(); }
  }
});

const composer = $("composer");
let dragDepth = 0;
document.addEventListener("dragenter", (ev) => { if (ev.dataTransfer?.types.includes("Files")) { dragDepth++; composer.classList.add("drag"); } });
document.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; composer.classList.remove("drag"); } });
document.addEventListener("dragover", (ev) => ev.preventDefault());
document.addEventListener("drop", (ev) => {
  ev.preventDefault();
  dragDepth = 0;
  composer.classList.remove("drag");
  const files = [...(ev.dataTransfer?.files || [])];
  if (files.length) uploadFiles(files);
});

// ---- live updates ----
function setStatus(live, text) {
  $("status").classList.toggle("live", live);
  $("status-text").textContent = text;
  $("status").querySelector(".dot").title = text; // the word is hidden on phones
}
function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => { setStatus(true, "live"); refresh(); };
  es.onerror = () => setStatus(false, "reconnecting");
  es.addEventListener("add", (m) => { upsert(JSON.parse(m.data)); sync(); });
  es.addEventListener("delete", (m) => { entries.delete(JSON.parse(m.data).id); sync(); });
  es.addEventListener("pin", (m) => {
    const { id, pinned } = JSON.parse(m.data);
    const e = entries.get(id);
    if (e) { upsert({ ...e, pinned }); sync(); }
  });
}
setInterval(() => document.querySelectorAll(".time").forEach((t) => (t.textContent = ago(+t.dataset.ts))), 30000);

renderMe();
$("me").addEventListener("click", renameDevice);
const sortSel = $("sort");
sortSel.value = sortMode;
sortSel.addEventListener("change", () => { sortMode = sortSel.value; prefs.set("pb.sort", sortMode); sync(); });

api("/api/limits").then((l) => { limits = l; renderUsage(); }).catch(() => {});
refresh();
connect();
</script>
</body>
